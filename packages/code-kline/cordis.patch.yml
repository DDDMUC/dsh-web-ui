# dsh-code-kline bundle patch: inserts its plugin row into the web profile
# roster. The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path-or-git-url>`.
#
# Host half: per-workspace code-workload K-line statistics served through
# `ctx.codeKline` (the API gateway's codeKline.* RPC seam queries it). The
# client chart surface lives in the sibling package @deepseek-ai/
# dsh-client-ui-code-kline (packages/ui-code-kline).
- insert:
    - id: code-kline
      name: '@deepseek-ai/dsh-code-kline'
