# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）
# dsh-skins 的 patch 行只有 ui-skin-center，汇总后自然展开
# self: 聚合包自身也作为插件加载（compat shim 的 host/client 已并入本包，
# 不再需要独立的 dsh-web-ui-compat npm 包 —— npm 对新包名收费）
patchFrom:
  - ../dsh-aionui-panel
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-pet
  - ../dsh-remote-web-ui
  - ../dsh-live-stats
  - ../dsh-ssh
  - ../dsh-web-ui-settings
  - ../dsh-skins
self:
  - ui-web-ui-compat
deps:
  - ../dsh-aionui-panel
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-pet
  - ../dsh-remote-web-ui
  - ../dsh-live-stats
  - ../dsh-ssh
  - ../dsh-web-ui-settings
  - ../dsh-skins
