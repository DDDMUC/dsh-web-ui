# dsh-client-ui-code-kline bundle patch: inserts its plugin row into the web
# profile roster. The bundle is the official dsh plugin shape — install it
# with `dsh plugin --profile <name> add <path-or-git-url>`.
#
# Browser half only: the sidebar workspace-row mini K-line and the quote
# branch (volume sub-chart + MA overlays). It queries the codeKline.list RPC
# served by the host-side @deepseek-ai/dsh-code-kline (packages/code-kline).
- insert:
    - id: ui-code-kline
      name: '@deepseek-ai/dsh-client-ui-code-kline'
