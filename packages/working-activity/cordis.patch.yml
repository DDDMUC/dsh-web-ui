# dsh-working-activity bundle patch: inserts its plugin row into the web
# profile roster. The bundle is the official dsh plugin shape — install it
# with `dsh plugin --profile <name> add <path-or-git-url>`.
#
# The row mounts the HOST half (activity/status state machine, TUI prompt
# slot). The Web UI half (TurnStatus label + WorkingLine) is integrated into
# the official client packages via patches/webui-working-activity.patch —
# apply it to the DSH source checkout for full Web UI support; the host
# half works without it.
- insert:
    - id: working-activity
      name: '@deepseek-ai/dsh-working-activity'
