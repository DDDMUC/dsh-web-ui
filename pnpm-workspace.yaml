packages:
  - 'packages/*'
  - 'packages/skins/*'

# Peer APIs (@deepseek-ai/dsh-*, cordis, react) resolve at runtime from the
# dsh profile tree, never from this repo's own install — matching the
# turtle-ui convention used by the bundled plugins.
autoInstallPeers: false

allowBuilds:
  # The cloudflared postinstall downloads the platform binary (the auto-tunnel
  # feature ships its own tunnel client — users install nothing).
  cloudflared: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.0.1-rc.2'
  - '@deepseek-ai/dsh-agent@0.0.1-rc.2'
  - '@deepseek-ai/dsh-api-remotes@0.0.1-rc.2'
