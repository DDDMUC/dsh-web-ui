name: Deploy Market

# Push 到 main 且市场相关文件变化时，把已提交的 market/dist 产物部署到
# Cloudflare Workers（Worker dsh-market，自定义域名 dsh-market.com），
# 同时幂等应用 D1 migration，并维护 gallery.dsh-market.com -> 根域的 301。
#
# 只部署「已提交」的产物，不在 CI 里重建（market-build --check 校验一致性）：
# 与本仓库 gallery 部署纪律一致，避免构建机绝对路径/不确定性进入产物。
#
# 需要的仓库 secrets：
#   CLOUDFLARE_API_TOKEN   — Workers Scripts / D1 / Redirect Rules / Zone · Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 账号 ID

on:
  push:
    branches:
      - main
    paths:
      - 'market/**'
      - 'packages/skins/**'
      - 'packages/dsh-pet/**'
      - 'packages/dsh-community-plugins/**'
      - 'scripts/market-build'
      - 'scripts/deploy-market'
      - 'scripts/market-layout.test.mjs'
      - 'package.json'
      - '.github/workflows/deploy-market.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy market to Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Step-level if cannot reference the secrets context (actionlint); gate on
    # the job-level env mirror instead.
    env:
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Market consistency
        run: pnpm market:check && pnpm community:check && pnpm test:scripts

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Deploy market
        run: node scripts/deploy-market
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Turnstile secret
        if: ${{ env.TURNSTILE_SECRET != '' }}
        run: echo "$TURNSTILE_SECRET" | wrangler secret put TURNSTILE_SECRET --config market/worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
